<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ファミリー旅行プランナー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero__badge">家族旅行をさくっと相談</div>
    <h1>ファミリー旅行プランナー</h1>
    <p>出発地、日数、移動手段、予算、子どもの年齢に合わせて、具体的な候補地と旅程を提案します。</p>
  </header>

  <main class="app-shell">
    <section class="card intro-card" aria-labelledby="intro-title">
      <h2 id="intro-title">家族の希望を入力してください</h2>
      <p>外部APIや予約機能は使わず、静的な候補地データから旅行相談のたたき台を作ります。</p>
    </section>

    <form id="tripForm" class="card form-card">
      <label class="wide-field">
        出発地
        <input type="text" id="departure" name="departure" placeholder="例：上牧駅、高槻、大阪、新潟市" required>
      </label>

      <label>
        日数
        <select id="duration" name="duration" required>
          <option value="daytrip">日帰り</option>
          <option value="1night">1泊2日</option>
          <option value="2nights">2泊3日</option>
          <option value="3nights">3泊4日</option>
          <option value="longer">それ以上</option>
        </select>
      </label>

      <label>
        移動手段
        <select id="transport" name="transport" required>
          <option value="car">車</option>
          <option value="train">電車</option>
          <option value="shinkansen">新幹線</option>
          <option value="flight">飛行機</option>
          <option value="bus">バス</option>
          <option value="walk-bike">徒歩・自転車</option>
          <option value="other">その他</option>
        </select>
      </label>

      <label>
        希望移動時間
        <select id="travelTime" name="travelTime" required>
          <option value="30m">30分以内</option>
          <option value="1h">1時間以内</option>
          <option value="2h" selected>2時間以内</option>
          <option value="3h">3時間以内</option>
          <option value="4h">4時間以内</option>
          <option value="4hplus">4時間以上も可</option>
        </select>
      </label>

      <label class="wide-field">
        目的
        <input type="text" id="purpose" name="purpose" placeholder="例：自然、海、高級旅館、温泉、子どもが遊べる" required>
      </label>

      <label>
        大人の人数
        <select id="adultCount" name="adultCount" required></select>
      </label>

      <label id="adultCustomWrap" class="is-hidden">
        大人の人数（10人以上）
        <input type="number" id="adultCustom" name="adultCustom" min="10" max="99" value="10">
      </label>

      <label>
        子どもの人数
        <select id="childCount" name="childCount" required></select>
      </label>

      <label id="childCustomWrap" class="is-hidden">
        子どもの人数（10人以上）
        <input type="number" id="childCustom" name="childCustom" min="10" max="99" value="10">
      </label>

      <fieldset id="childAges" class="age-fields wide-field is-hidden">
        <legend>子どもの年齢</legend>
        <div id="ageInputs" class="age-grid"></div>
      </fieldset>

      <label class="wide-field">
        予算
        <select id="budget" name="budget" required>
          <option value="under20">2万円未満</option>
          <option value="under40">2〜4万円</option>
          <option value="under60" selected>4〜6万円</option>
          <option value="under80">6〜8万円</option>
          <option value="under100">8〜10万円</option>
          <option value="100to150">10〜15万円</option>
          <option value="150to200">15〜20万円</option>
          <option value="over200">20万円以上</option>
        </select>
      </label>

      <button type="submit">旅行プランを提案する</button>
    </form>

    <section id="result" class="result-card is-hidden" aria-live="polite"></section>
  </main>

  <footer>
    <p>営業時間、休館日、料金、予約可否は公式サイトで確認してください。</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
