<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ファミ旅プランナー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero__badge">家族旅行をチャット相談のように整理</div>
    <h1>ファミ旅プランナー</h1>
    <p>出発地、人数、子どもの年齢、目的、予算に合わせて、1泊2日の具体的な旅行プランを複数提案します。</p>
  </header>

  <main class="app-shell">
    <section class="card intro-card" aria-labelledby="intro-title">
      <h2 id="intro-title">家族の希望を教えてください</h2>
      <p>外部APIや予約機能は使わず、GitHub Pagesでそのまま動く静的な旅行相談アプリです。</p>
    </section>

    <form id="tripForm" class="card form-card">
      <label>
        出発地
        <select id="departure" name="departure" required>
          <option value="大阪">大阪</option>
          <option value="高槻">高槻</option>
          <option value="京都">京都</option>
          <option value="新潟">新潟</option>
          <option value="その他">その他</option>
        </select>
      </label>

      <label>
        目的
        <select id="purpose" name="purpose" required>
          <option value="nature">自然を楽しむ</option>
          <option value="animals">動物とふれあう</option>
          <option value="onsen">温泉でのんびり</option>
          <option value="sea">海・水遊び</option>
          <option value="food">食事を楽しむ</option>
          <option value="rainy">雨でも遊べる</option>
        </select>
      </label>

      <label class="wide-field">
        目的の自由入力
        <input type="text" id="purposeNote" name="purposeNote" placeholder="例：ベビーカーで行きやすい、祖父母も一緒、移動は短め">
      </label>

      <label>
        大人の人数
        <select id="adultCount" name="adultCount" required></select>
      </label>

      <label id="adultCustomWrap" class="is-hidden">
        大人の人数（10人以上）
        <input type="number" id="adultCustom" name="adultCustom" min="10" max="99" value="10">
      </label>

      <label>
        子どもの人数
        <select id="childCount" name="childCount" required></select>
      </label>

      <label id="childCustomWrap" class="is-hidden">
        子どもの人数（10人以上）
        <input type="number" id="childCustom" name="childCustom" min="10" max="99" value="10">
      </label>

      <fieldset id="childAges" class="age-fields wide-field is-hidden">
        <legend>子どもの年齢</legend>
        <div id="ageInputs" class="age-grid"></div>
      </fieldset>

      <label>
        予算
        <select id="budget" name="budget" required>
          <option value="under20">〜2万円</option>
          <option value="under40">〜4万円</option>
          <option value="under60" selected>〜6万円</option>
          <option value="under80">〜8万円</option>
          <option value="under100">〜10万円</option>
          <option value="100to150">10〜15万円</option>
          <option value="150to200">15〜20万円</option>
          <option value="over200">それ以上</option>
        </select>
      </label>

      <button type="submit">旅行プランを提案する</button>
    </form>

    <section id="result" class="result-card is-hidden" aria-live="polite"></section>
  </main>

  <footer>
    <p>HTML / CSS / JavaScriptのみで動作します。</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
